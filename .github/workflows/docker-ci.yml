name: docker-ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: docker compose config
        run: docker compose config -q
      - name: build backend image
        run: docker build -t trads-backend ./backend-golang
      - name: build frontend image
        run: docker build -t trads-frontend ./frontend
