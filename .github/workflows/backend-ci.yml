name: backend-ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend-golang/go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)"
        working-directory: backend-golang
      - name: go vet
        run: go vet ./...
        working-directory: backend-golang
      - name: go test
        run: go test ./... -count=1
        working-directory: backend-golang

  integration:
    runs-on: ubuntu-latest
    needs: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: trads
          POSTGRES_USER: trads
          POSTGRES_PASSWORD: trads
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U trads -d trads"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://trads:trads@localhost:5432/trads?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend-golang/go.mod
      - name: database migrate
        run: |
          for file in db/migrations/*.up.sql; do
            psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f "$file"
          done
      - name: go test integration
        run: go test ./... -run Integration -v
        working-directory: backend-golang
