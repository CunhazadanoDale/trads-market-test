name: backend-ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend-golang/go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)"
        working-directory: backend-golang
      - name: go vet
        run: go vet ./...
        working-directory: backend-golang
      - name: go test
        run: go test ./... -count=1
        working-directory: backend-golang
