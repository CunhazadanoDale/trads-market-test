services:
  postgres:
    image: postgres:16
    container_name: trads-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_DB=trads
      - POSTGRES_USER=trads
      - POSTGRES_PASSWORD=trads
    ports:
      - "5444:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trads -d trads"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 30s

  migrate:
    image: migrate/migrate:latest
    container_name: trads-migrate
    entrypoint: ["migrate"]
    volumes:
      - ./backend-golang/db/migrations:/migrations
    depends_on:
      - postgres

volumes:
  postgres_data: